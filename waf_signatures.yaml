- name: Cloudflare
  headers:
    - cf-ray
    - cf-cache-status
  cookies:
    - __cf_bm
    - cf_clearance

- name: AWS CloudFront / WAF
  headers:
    - x-amzn-requestid
    - x-amz-cf-id
    - x-amz-cf-pop

- name: Imperva Incapsula
  headers:
    - x-iinfo
    - x-cdn
  cookies:
    - incap_ses_
    - visid_incap_

- name: Akamai
  headers:
    - x-akamai-transformed
    - x-akamai-request-id
    - akamai-origin-hop

- name: Sucuri
  headers:
    - x-sucuri-id
    - x-sucuri-cache

- name: Fastly
  headers:
    - x-fastly-request-id
    - fastly-restarts

- name: ModSecurity
  body_words:
    - "Mod_Security"
    - "mod_security"
    - "This error was generated by Mod_Security"
